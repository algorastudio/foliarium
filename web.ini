; Configurazione di sviluppo per il backend FastAPI (api/main.py).
; NON committare credenziali reali in questo file: copialo come web.local.ini
; e personalizzalo, oppure usa variabili d'ambiente DB_HOST/DB_USER/DB_PASS/DB_NAME/DB_PORT.

[database]
host     = localhost
port     = 5432
name     = catasto_storico
user     = postgres
; Lascia vuoto e definisci la password tramite variabile d'ambiente DB_PASS
; oppure tramite keyring di sistema (servizio "foliarium_db_<host>", utente <user>).
password =

[server]
; Usa 0.0.0.0 per rendere il server accessibile da tutta la rete
; Usa 127.0.0.1 per accesso solo dal PC locale
host = 127.0.0.1
port = 8000
