name: CI/CD Foliarium (Test & Build)

on:
  push:
    branches: [ "main", "master", "foliarium/enterprise", "claude/summarize-dev-status-vDVnI", "claude/create-demo-version-qUbik", "claude/analyze-dev-progress-sPWUb", "claude/release-1.0.0-testing-wbblE", "claude/product-delivery-prep-ujTLi" ]
    tags:
      - '*.*.*'        # es. 1.0.0
      - 'v*.*.*'       # es. v1.0.0
  pull_request:
    branches: [ "main", "master" ]
    # Il job di build Windows e' skippato sulle PR via
    # `if: github.event_name != 'pull_request'`: solo il test job gira,
    # cosi' otteniamo feedback rapido senza pagare i runner pesanti.
  workflow_dispatch: # Permette di avviare l'azione manualmente da GitHub

permissions:
  contents: read

env:
  # Versione dei binari PostgreSQL inclusi nell'installer Windows.
  # L'applicazione richiede PostgreSQL 14+; il ramo 16 e' quello su cui e'
  # verificata. Cambiandola qui cambia il bundle: allineare anche
  # docs/admin/installazione.md, che la cita all'utente.
  PG_BUNDLE_VERSION: "16.10-1"

jobs:
  # ==========================================
  # FASE 1: TEST (su Linux con PostgreSQL)
  # ==========================================
  test-database-and-code:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: catasto_storico
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Installazione librerie di sistema per Qt6
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libegl1 libgl1 libnss3 libnspr4

    - name: Installazione Dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
        pip install ruff

    - name: Lint (ruff) — gate sui bug reali (F821 / E9)
      # F821 = nomi non definiti, E9 = errori di sintassi.
      # Le altre regole sono solo informative (continue-on-error)
      # finché il codebase non viene formattato.
      run: |
        ruff check --select=F821,E9 --exclude=tests
        ruff check --statistics --exclude=tests || true

    - name: Inizializzazione Database di Test
      env:
        PGPASSWORD: testpassword
      run: |
        sudo apt-get install -y postgresql-client
        # Schema base + lookup + soft-delete (v1.0.0 fresh install order)
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/02_creazione-schema-tabelle.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/03_funzioni-procedure.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/03b_expand_fuzzy_search.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/07_user-management.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/08_advanced-reporting.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/09_backup-system.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/10_performance-optimization.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/11_advanced-cadastral-features.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/12_procedure_crud.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/13_workflow_integrati.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/14_report_functions.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/15_integration_audit_users.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/16_advanced_search.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/17_funzione_ricerca_immobili.sql
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/18_funzioni_trigger_audit.sql
        # CREATE INDEX CONCURRENTLY non può stare in una transazione — va per ultimo
        psql -h localhost -U postgres -d catasto_storico -f sql_scripts/07_create_trigram_indexes.sql
        # Bootstrap admin con password di test
        psql -h localhost -U postgres -d catasto_storico \
          -v admin_password="'testpassword'" \
          -v admin_email="'admin@test.local'" \
          -f sql_scripts/07a_bootstrap_admin.sql
        # Migrazioni post-init: aggiornano funzioni/viste allo schema v1.6.1+
        psql -h localhost -U postgres -d catasto_storico \
          -f sql_scripts/migrations/20_fix_report_function_civico.sql

    - name: Esecuzione Test Automatici (Pytest + Coverage)
      env:
        CI: true
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASS: testpassword
        DB_NAME: catasto_storico
        DB_PORT: 5432
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest tests/

    - name: Caricamento Report Coverage (HTML)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Foliarium-Coverage-Report
        path: coverage_html/
        if-no-files-found: ignore

    # ----------------------------------------------------------
    # SCREENSHOT AUTOMATICI: avvia la GUI headless e cattura
    # immagini consultabili direttamente su GitHub come artifact
    # ----------------------------------------------------------
    - name: Acquisizione Screenshot GUI
      env:
        CI: true
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASS: testpassword
        DB_NAME: catasto_storico
        DB_PORT: 5432
        QT_QPA_PLATFORM: offscreen
      run: |
        python tests/take_screenshots.py || true

    - name: Caricamento Screenshot
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Foliarium-Screenshots
        path: screenshots/*.png
        if-no-files-found: ignore

  # ==========================================
  # FASE 1b: VALIDAZIONE INSTALLER
  # Compila Foliarium_Installer.iss contro un dist/ fittizio, solo per
  # verificarne la sintassi (sezioni, direttive e soprattutto il Pascal
  # Script in [Code]). Gira ANCHE sulle pull request, a differenza del
  # build vero: senza questo job un errore nell'installer si scoprirebbe
  # solo dopo il merge su main, quando il build completo lo compila.
  # Dura un paio di minuti e non produce artefatti.
  # ==========================================
  valida-installer:
    runs-on: windows-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Preparazione di un dist/ fittizio
      # iscc si rifiuta di compilare se una voce [Files] non trova sorgenti.
      # Servono solo i nomi giusti: il contenuto non viene ispezionato.
      run: |
        New-Item -ItemType Directory -Force -Path dist\Foliarium\_internal | Out-Null
        Set-Content dist\Foliarium\Foliarium.exe "segnaposto"
        Set-Content dist\Foliarium\setup_db.exe  "segnaposto"
        Set-Content dist\Foliarium\_internal\segnaposto.txt "segnaposto"
      shell: pwsh

    - name: Compilazione di prova dell'installer
      run: iscc /O"installer_prova" Foliarium_Installer.iss

    - name: Esito
      run: |
        $exe = Get-ChildItem installer_prova\*.exe | Select-Object -First 1
        if (-not $exe) { throw "iscc non ha prodotto alcun installer" }
        Write-Host "Installer di prova compilato: $($exe.Name)"
      shell: pwsh

  # ==========================================
  # FASE 2: BUILD (su Windows per Inno Setup)
  # ==========================================
  build-windows:
    needs: test-database-and-code # Parte SOLO se i test sopra hanno successo
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Installazione Dipendenze per Build
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilazione Eseguibile con PyInstaller
      run: pyinstaller foliarium.spec

    - name: Compilazione setup_db.exe (inizializzazione database)
      # Eseguibile separato: l'installer non puo' assumere Python sulla
      # macchina del cliente. Usa solo la libreria standard, quindi pesa
      # pochi MB (vedi setup_db.spec).
      run: |
        pyinstaller setup_db.spec --distpath dist_setupdb
        Copy-Item dist_setupdb\setup_db.exe dist\Foliarium\setup_db.exe
      shell: pwsh

    - name: Download binari PostgreSQL
      # Binari EnterpriseDB per Windows x64. Lo ZIP contiene una cartella
      # "pgsql" alla radice, che e' esattamente il layout che
      # setup_database.py si aspetta in install_dir/pgsql/bin.
      run: |
        $url = "https://get.enterprisedb.com/postgresql/postgresql-$env:PG_BUNDLE_VERSION-windows-x64-binaries.zip"
        Write-Host "Download da $url"
        Invoke-WebRequest -Uri $url -OutFile pgsql.zip -UseBasicParsing
        Expand-Archive -Path pgsql.zip -DestinationPath pg_extract -Force
        Remove-Item pgsql.zip

        # Potatura: lo ZIP pesa 822 MB estratti, di cui 673 solo di pgAdmin 4.
        # Al database servono bin/, lib/ e share/ — 120 MB in tutto.
        foreach ($dir in @("pgAdmin 4", "doc", "include", "StackBuilder", "symbols")) {
            $path = "pg_extract\pgsql\$dir"
            if (Test-Path $path) {
                Remove-Item -Recurse -Force $path
                Write-Host "  rimosso $dir"
            }
        }

        Move-Item pg_extract\pgsql dist\Foliarium\pgsql
        Remove-Item -Recurse -Force pg_extract

        # Verifica che ci sia tutto il necessario: un binario mancante si
        # manifesterebbe solo durante l'installazione sulla macchina del
        # cliente, a meta' del setup del database.
        foreach ($exe in @("initdb", "pg_ctl", "postgres", "psql", "pg_isready", "pg_dump", "pg_restore")) {
            if (-not (Test-Path "dist\Foliarium\pgsql\bin\$exe.exe")) {
                throw "Binario PostgreSQL mancante: $exe.exe"
            }
        }
        # pg_trgm, pgcrypto e uuid-ossp sono richieste dagli script di schema.
        # (system_stats non e' nei binari standard: gli script la saltano.)
        foreach ($ext in @("pg_trgm", "pgcrypto", "uuid-ossp")) {
            if (-not (Test-Path "dist\Foliarium\pgsql\share\extension\$ext.control")) {
                throw "Estensione PostgreSQL mancante: $ext"
            }
        }
        $mb = [math]::Round((Get-ChildItem -Recurse dist\Foliarium\pgsql | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
        Write-Host "PostgreSQL $env:PG_BUNDLE_VERSION incluso nel bundle: $mb MB"
      shell: pwsh

    - name: Compilazione Installer con Inno Setup
      # Build non firmata (la firma Authenticode è locale al rilascio: vedi
      # signing/README.md — Certum SimplySign cloud + OTP, non automatizzabile
      # sui runner GitHub-hosted).
      run: iscc Foliarium_Installer.iss

    - name: Caricamento Installer Finito
      uses: actions/upload-artifact@v4
      with:
        name: Foliarium-Setup-Windows
        path: Installer\*.exe

  # ==========================================
  # FASE 3: PUBBLICA RELEASE GITHUB
  # Si attiva SOLO quando viene pushato un tag tipo 1.6.0 o v1.6.0.
  # Scarica l'installer Windows, calcola il checksum SHA-256
  # (l'auto-updater lo verifica) e crea/aggiorna la release.
  # I build Linux/macOS e la versione portabile sono stati accantonati:
  # il pipeline pubblica solo l'installer Windows (Inno Setup).
  # ==========================================
  create-release:
    needs:
      - build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write   # necessario per creare la release

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Download di tutti gli artefatti
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Elenco artefatti scaricati
      run: |
        echo "=== Contenuto artifacts/ ==="
        find artifacts/ -type f | sort
        echo ""
        echo "=== Dimensioni totali ==="
        du -sh artifacts/* 2>/dev/null || true

    - name: Generazione checksum SHA-256 per asset binari
      run: |
        cd artifacts/
        find . -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" \) -print0 \
          | while IFS= read -r -d '' f; do
              sha256sum "$f" > "$f.sha256"
              echo "  [SHA-256] $f"
            done

    - name: Estrazione versione dal tag
      id: version
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Versione rilevata: $VERSION"

    - name: Estrazione note di release dal changelog
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Rimuove eventuale prefisso 'v' (v1.6.0 -> 1.6.0)
        CLEAN_VERSION="${VERSION#v}"
        CHANGELOG="docs/riferimento/changelog.md"
        NOTES_FILE="release_notes.md"

        if [ -f "$CHANGELOG" ]; then
          # Estrae la sezione tra "## v1.6.0" e il successivo "## v"
          awk -v ver="$CLEAN_VERSION" '
            $0 ~ "^## v" ver " " { found=1; print; next }
            found && /^## v/ { exit }
            found { print }
          ' "$CHANGELOG" > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            echo "Note di release estratte da $CHANGELOG (sezione v$CLEAN_VERSION)."
          else
            echo "Sezione v$CLEAN_VERSION non trovata nel changelog, uso messaggio di default."
            echo "Release Foliarium $VERSION." > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Vedi il [changelog completo](https://github.com/${{ github.repository }}/blob/main/docs/riferimento/changelog.md) per i dettagli." >> "$NOTES_FILE"
          fi
        else
          echo "Changelog non trovato, uso messaggio di default."
          echo "Release Foliarium $VERSION." > "$NOTES_FILE"
        fi

        echo ""
        echo "=== Anteprima note di release ==="
        head -30 "$NOTES_FILE"

    - name: Creazione/Aggiornamento GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"

        # Raccoglie tutti gli asset (binari + checksum)
        ASSETS=()
        while IFS= read -r -d '' f; do
          ASSETS+=("$f")
        done < <(find artifacts/ -type f \
          \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" \) \
          -print0)

        echo "Asset da pubblicare: ${#ASSETS[@]}"
        for a in "${ASSETS[@]}"; do echo "  - $a"; done

        if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo ""
          echo "Release $VERSION esiste già — upload asset (--clobber)..."
          gh release upload "$VERSION" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
        else
          echo ""
          echo "Creazione nuova release $VERSION..."
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "Foliarium $VERSION" \
            --notes-file release_notes.md \
            "${ASSETS[@]}"
        fi

        echo ""
        echo "Release pubblicata: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
