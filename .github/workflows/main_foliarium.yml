# Deploy del backend web di Foliarium su Azure Web App.
#
# Foliarium e' un'applicazione desktop PyQt6; quello che viene pubblicato qui
# e' il solo componente web: l'API REST di `api/` piu' il frontend React che
# essa serve come contenuto statico. Il resto del repository (GUI, reporting
# PDF, MCP server, documentazione) non entra nell'artefatto.
#
# Il workflow originale, generato dal portale Azure, installava l'intero
# requirements.txt con `python-version: '3.x'`: su Python 3.14 pillow non ha
# wheel precompilati e la compilazione da sorgente fallisce senza libjpeg.
# Non ha mai completato un deploy. Ora la versione di Python e' fissata come
# nel resto del progetto e le dipendenze sono quelle del solo backend.

name: Build and deploy Python app to Azure Web App - foliarium

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # richiesto da actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        # Fissata a 3.12 come negli altri workflow e come dichiarato dal
        # progetto. '3.x' seguirebbe l'ultima versione disponibile sul runner,
        # che e' esattamente come questo deploy si era rotto.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build del frontend React
        # frontend/dist/ non e' nel repository (e' in .gitignore): senza questo
        # passaggio api/main.py non troverebbe nulla da montare e il sito
        # risponderebbe solo sulle rotte /api.
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Composizione dell'artefatto di deploy
        # Solo i moduli nella catena di import di api.main, piu' il frontend
        # compilato. requirements-web.txt diventa requirements.txt perche'
        # Oryx, il motore di build di App Service, cerca quel nome.
        run: |
          mkdir -p deploy/frontend
          cp -r api db core utils deploy/
          cp catasto_db_manager.py config.py app_paths.py catasto_exceptions.py validators.py deploy/
          cp -r frontend/dist deploy/frontend/dist
          cp requirements-web.txt deploy/requirements.txt
          find deploy -type d -name __pycache__ -prune -exec rm -rf {} +
          echo "Contenuto dell'artefatto:"
          du -sh deploy
          ls deploy

      - name: Verifica che l'artefatto sia autosufficiente
        # Installa le sole dipendenze web e importa l'app dalla cartella che
        # verra' pubblicata. Un modulo dimenticato si manifesterebbe altrimenti
        # come un sito che non parte, dopo il deploy.
        working-directory: deploy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          import importlib, sys
          sys.path.insert(0, ".")
          # Import dei moduli senza create_app(): quello aprirebbe il pool
          # PostgreSQL e resterebbe in retry per un minuto, inutilmente.
          for nome in (
              "config", "app_paths", "catasto_db_manager",
              "api.main", "api.deps", "api.auth",
              "api.routes.auth", "api.routes.comuni", "api.routes.partite",
              "api.routes.possessori", "api.routes.immobili",
              "api.routes.dashboard", "api.routes.audit",
              "api.routes.genealogia", "api.routes.timeline",
          ):
              importlib.import_module(nome)
              print(f"  ok  {nome}")
          print("Artefatto autosufficiente.")
          PY

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # richiesto per la richiesta del JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_98ED3FF0700D480B8EA2175AD377BE71 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4AC55EB20EA94B9A9AE980B2BC0989A1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1BB60B8D1DF449048354AF46E2244B0E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'foliarium'
          slot-name: 'Production'
          # create_app e' una factory, non un'istanza: senza --factory uvicorn
          # pubblicherebbe la funzione invece dell'applicazione. La porta 8000
          # e' quella che App Service si aspetta di trovare in ascolto.
          startup-command: 'python -m uvicorn api.main:create_app --factory --host 0.0.0.0 --port 8000'
