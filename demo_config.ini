# demo_config.ini — Configurazione DB per la versione Demo di Foliarium
#
# Le stesse credenziali possono essere configurate tramite variabili d'ambiente:
#   DEMO_DB_HOST, DEMO_DB_NAME, DEMO_DB_USER, DEMO_DB_PASS, DEMO_DB_PORT
#
# Utente autologin demo (deve esistere nella tabella 'utenti' del DB):
#   DEMO_LOGIN_USER, DEMO_LOGIN_PASS
#
# ---------------------------------------------------------------------------
# INIZIALIZZAZIONE DEL DB DEMO (da eseguire una volta come superuser)
# ---------------------------------------------------------------------------
# 1. Crea il DB e lo schema:
#      createdb -U postgres catasto_storico
#      psql -U postgres -d catasto_storico -f sql_scripts/02_creazione-schema-tabelle.sql
#      psql -U postgres -d catasto_storico -f sql_scripts/03_funzioni-procedure.sql
#
# 2. Carica i dati dimostrativi (Savona 1870-1985, ~300 partite):
#      psql -U postgres -d catasto_storico -f sql_scripts/05_demo_dataset.sql
#
# 3. Crea il ruolo PostgreSQL e l'utente applicativo demo:
#      psql -U postgres -d catasto_storico <<'SQL'
#        -- Ruolo DB con accesso in sola lettura + inserimento
#        DO $$ BEGIN
#          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='demo_user') THEN
#            CREATE ROLE demo_user LOGIN PASSWORD 'demo2025';
#          END IF;
#        END $$;
#        GRANT CONNECT ON DATABASE catasto_storico TO demo_user;
#        GRANT USAGE ON SCHEMA public TO demo_user;
#        GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO demo_user;
#        GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO demo_user;
#
#        -- Utente applicativo nella tabella 'utenti' di Foliarium
#        INSERT INTO utenti (username, password_hash, nome_completo, ruolo, attivo)
#        VALUES (
#          'demo',
#          -- hash bcrypt di 'demo2025' (generato con: python -c "import bcrypt; print(bcrypt.hashpw(b'demo2025', bcrypt.gensalt()).decode())")
#          '$2b$12$PLACEHOLDER_SOSTITUISCI_CON_HASH_REALE',
#          'Utente Demo',
#          'operatore',
#          true
#        ) ON CONFLICT (username) DO NOTHING;
#      SQL
#
# NOTA: per generare l'hash bcrypt reale eseguire:
#   python -c "import bcrypt; print(bcrypt.hashpw(b'demo2025', bcrypt.gensalt()).decode())"
# ---------------------------------------------------------------------------

[demo_database]
host     = localhost
port     = 5432
dbname   = catasto_storico
user     = demo_user
# Imposta la password tramite variabile d'ambiente DEMO_DB_PASS
# oppure sostituisci questo placeholder prima dell'uso
db_pass  = ${DEMO_DB_PASS}

[demo_login]
username = demo
# Imposta la password tramite variabile d'ambiente DEMO_LOGIN_PASS
# oppure sostituisci questo placeholder prima dell'uso
login_pass = ${DEMO_LOGIN_PASS}
