# docker-compose.yml — Foliarium full stack (PostgreSQL 14 + FastAPI + React)
#
# Uso rapido:
#   docker compose up -d --build           # primo avvio: build + run
#   docker compose logs -f app             # tail dei log
#   docker compose down                    # stop (i dati restano nel volume)
#   docker compose down -v                 # stop + reset DB (volume eliminato!)
#
# Login: admin, con la password di ADMIN_PASSWORD (default admin123, adatto
# solo allo sviluppo). Prova completa dello stack: bash docker/prova-web.sh

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: foliarium-db:latest
    container_name: foliarium-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-catasto_storico}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      # Utente applicativo `admin`: senza questa variabile l'inizializzazione
      # non lo crea (vedi docker/postgres/init.sh). Il default vale solo per
      # lo sviluppo: in produzione impostare ADMIN_PASSWORD nel file .env.
      FOLIARIUM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LANG:    it_IT.UTF-8
      LC_ALL:  it_IT.UTF-8
    volumes:
      - foliarium_db_data:/var/lib/postgresql/data
    healthcheck:
      # Via TCP, non sul socket: mentre applica gli script iniziali postgres
      # ascolta solo sul socket, e l'app non deve partire prima che
      # l'inizializzazione sia finita.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Espone la porta solo se serve accedere al DB dall'host (es. con psql/pgAdmin)
    ports:
      - "${DB_HOST_PORT:-5433}:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: foliarium-app:latest
    container_name: foliarium-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-catasto_storico}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      FOLIARIUM_DB_SCHEMA: ${DB_SCHEMA:-catasto}
      # Per un host diverso da localhost l'applicazione impone TLS
      # (sslmode=require, vedi db/base.py), ma il database qui accanto e' un
      # container senza certificati: con `require` l'app non si collega.
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
    ports:
      - "${APP_PORT:-8765}:8765"

volumes:
  foliarium_db_data:
    name: foliarium_db_data
