<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Caratteri della demo.

  I temi di Foliarium (styles/*.qss) chiedono caratteri di Windows che in
  questa immagine non ci sono e non possono esserci, per ragioni di licenza.
  Qui ogni nome viene indirizzato a un carattere libero.

  Arial, Times New Roman e Calibri hanno sostituti con le stesse metriche
  (Liberation, Carlito): l'impaginazione resta identica. Segoe UI, Georgia e
  Palatino non ne hanno: il testo e' simile ma non identico al pixel.

  binding="same" rende la sostituzione vincolante: senza, fontconfig la
  tratterebbe come un suggerimento e Qt, che prende il primo nome risolto,
  ricadrebbe sul carattere di ripiego.
-->
<fontconfig>

  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Trebuchet MS</family>
    <prefer><family>Open Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Georgia</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Palatino Linotype</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Book Antiqua</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>

  <!-- Caratteri generici: cio' che non nomina un carattere preciso (titoli
       delle finestre, dialoghi di sistema) usa gli stessi dell'applicazione. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Open Sans</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>

</fontconfig>
