# Foliarium — template di configurazione.
#
# Copiare come `config.ini` accanto all'eseguibile (o alla root del progetto,
# se si esegue dai sorgenti) e compilare i valori.
#
# Normalmente questo file NON va scritto a mano: `setup_database.py` lo genera
# con le credenziali create durante l'inizializzazione del database.
#
# Precedenza dei valori: config.ini > variabili d'ambiente > default.

[database]
host = localhost
port = 5432
# ATTENZIONE: la chiave è "dbname", non "database".
dbname = catasto_storico
user = foliarium
password = CHANGE_ME
# sslmode libpq: disable | allow | prefer | require | verify-ca | verify-full
# Se omesso: "prefer" per host locali, "require" per host remoti.
# sslmode =

# Sezione scritta da setup_database.py per il PostgreSQL gestito
# dall'installer. Lasciare vuota con un PostgreSQL di sistema.
# [service]
# name = FoliariumDB
# pg_bin = C:\Program Files\Foliarium\pgsql\bin
# pg_data = C:\ProgramData\Foliarium\pg_data
