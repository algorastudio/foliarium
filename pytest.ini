[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage misurata solo sui moduli logicamente testabili in modo affidabile
# (DB layer, servizi, validators, utils). I file GUI (gui_main, gui_widgets,
# search_widgets, partita_workflow_widgets, dialogs) sono esclusi: richiedono
# QApplication + DB live + interazione utente, per cui i numeri di coverage
# sarebbero fuorvianti. Vanno testati con marker `gui` o `integration` e
# coperti a parte (manualmente / smoke test).
addopts = -v --tb=short --strict-markers --color=yes --cov=catasto_db_manager --cov=app_utils --cov=app_paths --cov=config --cov=validators --cov=db --cov=core --cov=api --cov=utils --cov=foliarium --cov-report=term-missing --cov-report=html:coverage_html --cov-report=xml:coverage.xml
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    gui: marks tests that require GUI
    unit: marks tests as unit tests
    golden_path: end-to-end happy path da proteggere assolutamente da regressioni
