[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --color=yes --cov=catasto_db_manager --cov=app_utils --cov=app_paths --cov=config --cov-report=term-missing --cov-report=html:coverage_html --cov-report=xml:coverage.xml
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    gui: marks tests that require GUI
    unit: marks tests as unit tests